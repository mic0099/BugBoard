services:

  backend:
    build: .

    container_name: bugboard-backend

    ports:
      - "3000:3000"

    env_file:
      - .env.local

    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: bugboard-postgres

    environment:
      POSTGRES_DB: bugboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bugboard"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data: