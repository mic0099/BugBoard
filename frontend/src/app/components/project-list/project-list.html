<div class="min-h-screen bg-gradient-to-br from-slate-700 to-gray-800 p-6 md:p-10">

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.15),transparent_60%)] pointer-events-none"></div>

  <div class="relative z-10">

    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-6">
      <div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">
          Project Dashboard
        </h1>

        <p class="text-gray-300 mt-1.5 text-base">
          Select a project to review active issues and collaborate with your team on technical solutions.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">

        <button
          *ngIf="authService.isAdmin()"
          (click)="newUser()"
          class="bg-blue-600 hover:bg-blue-500
          text-white text-sm font-semibold
          px-5 py-2.5 rounded-xl
          shadow-lg shadow-blue-900/30
          transition-all flex items-center gap-2">

          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4v16m8-8H4"></path>
          </svg>

          New User
        </button>

        <button
          *ngIf="authService.isAdmin()"
          (click)="newProject()"
          class="bg-blue-600 hover:bg-blue-500
          text-white text-sm font-semibold
          px-5 py-2.5 rounded-xl
          shadow-lg shadow-blue-900/30
          transition-all flex items-center gap-2">

          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4v16m8-8H4"></path>
          </svg>

          New Project
        </button>

      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">

      <app-project-item
        *ngFor="let item of projects"
        [project]="item"
        (onEdit)="openEditModal(item)">
      </app-project-item>

    </div>

  </div>
</div>

<app-projectedit
  *ngIf="selectedProject"
  [project]="selectedProject"
  (close)="closeModal()"
  (updated)="onProjectUpdated()">
</app-projectedit>
