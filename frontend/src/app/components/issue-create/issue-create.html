<div class="min-h-screen bg-gradient-to-br from-slate-700 to-gray-800 p-6 md:p-10 relative">

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.15),transparent_55%)] pointer-events-none"></div>

  <div class="relative z-10 max-w-3xl mx-auto">

    <!-- HEADER -->
    <div class="mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
        New Issue
      </h1>
      <p class="text-gray-300 mt-2 text-base">
        Report a new issue for this project.
      </p>
    </div>

    <!-- CARD -->
    <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl shadow-blue-950/20 p-6 md:p-8">

      <form [formGroup]="issue" (ngSubmit)="onSubmit()" class="space-y-8">

        <!-- TITLE -->
        <div>
          <label class="block text-sm font-semibold text-gray-200 mb-2">
            Title
          </label>

          <input
            type="text"
            formControlName="title"
            placeholder="Add Issue Title"
            class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
          />
        </div>

        <!-- DESCRIPTION -->
        <div>
          <label class="block text-sm font-semibold text-gray-200 mb-2">
            Description
          </label>

          <textarea
            formControlName="description"
            rows="4"
            placeholder="Describe the problem..."
            class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
          ></textarea>
        </div>

        <!-- SELECT GRID -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

          <div>
            <label class="block text-sm font-semibold text-gray-200 mb-2">Priority</label>
            <select formControlName="priority"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30">
              <option value="low" class="bg-slate-800">Low</option>
              <option value="medium" class="bg-slate-800">Medium</option>
              <option value="high" class="bg-slate-800">High</option>
              <option value="blocker" class="bg-slate-800">Blocker</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-200 mb-2">Type</label>
            <select formControlName="type"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30">
              <option value="bug" class="bg-slate-800">Bug</option>
              <option value="feature" class="bg-slate-800">Feature</option>
              <option value="question" class="bg-slate-800">Question</option>
              <option value="documentation" class="bg-slate-800">Documentation</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-200 mb-2">Status</label>
            <select formControlName="status"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30">
              <option value="open" class="bg-slate-800">Open</option>
              <option value="todo" class="bg-slate-800">Todo</option>
              <option value="in_progress" class="bg-slate-800">In Progress</option>
            </select>
          </div>

        </div>

        <!-- TAGS -->
        <div>
          <label class="block text-sm font-semibold text-gray-200 mb-2">Tags</label>

          <div class="space-y-3">

            <div *ngFor="let tag of tags.controls; let i = index" class="flex items-center gap-3">
              <input
                type="text"
                [formControl]="tag"
                placeholder="Add tag"
                class="flex-1 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
              />
              <button
                type="button"
                (click)="tags.removeAt(i)"
                class="px-3 py-2 rounded-xl bg-red-500/80 hover:bg-red-500 text-white text-sm transition"
              >
                ✕
              </button>
            </div>

            <button
              type="button"
              (click)="addtags()"
              class="w-full border border-dashed border-white/20 text-gray-300 py-2 rounded-2xl hover:bg-white/5 transition"
            >
              + Add Tag
            </button>

          </div>
        </div>

        <!-- FILE -->
        <div>
          <label class="text-gray-300 text-sm font-semibold">Image (optional)</label>

          <input #fileInput type="file" (change)="onFileSelected($event)" class="w-full mt-1 text-gray-300" />

          <div *ngIf="selectedFile" class="mt-3 flex items-center gap-3">
            <div class="flex-1 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white text-sm">
              {{ selectedFile.name }}
            </div>

            <button
              type="button"
              (click)="removeFile(fileInput)"
              class="px-3 py-2 rounded-xl bg-red-500/80 hover:bg-red-500 text-white text-sm transition"
            >
              ✕
            </button>
          </div>
        </div>

        <!-- BUTTONS -->
        <div class="flex justify-between items-center pt-4">

          <!-- SINISTRA -->
          <button
            type="button"
            (click)="onCancel()"
            class="px-6 py-3 rounded-xl border border-white/10 bg-white/5 text-slate-300 font-semibold hover:bg-white/10 hover:text-white hover:border-white/20 transition-all active:scale-95"
          >
            Cancel
          </button>

          <!-- DESTRA -->
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-2xl shadow-lg shadow-blue-900/30 transition-all"
          >
            Create Issue
          </button>

        </div>

      </form>

    </div>
  </div>
</div>
