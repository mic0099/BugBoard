<div (click)="goToIssues(project.projectId)"
class="group relative bg-white/5 border border-white/15 rounded-2xl shadow-lg p-6 hover:-translate-y-1 hover:shadow-blue-500/20 hover:bg-gray-900/60 hover:border-blue-500/50 transition-all duration-300 flex flex-col h-full overflow-hidden">
  
  <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/10 rounded-full blur-3xl group-hover:bg-blue-600/20 transition-colors"></div>

  <div class="flex-grow relative z-10">
    <div class="flex justify-between items-start mb-4">
      <div class="p-2.5 bg-blue-500/10 rounded-lg border border-blue-500/20 group-hover:scale-110 transition-transform duration-300">
        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
        </svg>
      </div>

      <span class="bg-slate-800 text-blue-400 text-xs font-bold px-2.5 py-1 rounded-full border border-blue-500/30">
        {{ project.issuesCount || 0 }} Issues
      </span>
    </div>

    <h3 class="text-white font-bold text-xl mb-2 leading-tight group-hover:text-blue-400 transition-colors">
      {{ project.name }}
    </h3>
    
    <p class="text-gray-400 text-sm mb-4 line-clamp-2">
      Stay updated on the status of issues in {{ project.name }}.
    </p>
  </div>

  <div class="mt-auto pt-4 border-t border-white/10 flex justify-between items-center relative z-10">
    <div class="flex flex-col">
      <span class="text-gray-500 text-[10px] uppercase tracking-wider font-semibold">Created at</span>
      <span class="text-gray-300 text-xs">{{ project.createdAt | date:'dd MMM yyyy' }}</span>
    </div>

    <div class="flex gap-2">
      <button 
        *ngIf="authService.isAdmin()"
        (click)="openEdit($event)" 
        class="text-blue-400 hover:text-white p-1.5 rounded-lg hover:bg-amber-600/20 transition-all"
        title="Modify Project">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
