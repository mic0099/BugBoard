<div class="min-h-screen bg-gradient-to-br from-slate-700 to-gray-800 p-6 md:p-10 relative">

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.15),transparent_55%)] pointer-events-none"></div>

  <div class="relative z-10 max-w-3xl mx-auto">

    <!-- HEADER -->
    <div class="mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
        Create User
      </h1>
      <p class="text-gray-300 mt-2 text-base">
        Add a new user to the system.
      </p>
    </div>

    <!-- CARD -->
    <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl shadow-blue-950/20 p-6 md:p-8">

      <form [formGroup]="userAddForm" (ngSubmit)="onSubmit()" class="space-y-8">

        <!-- NAME + SURNAME -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>
            <label class="block text-sm font-semibold text-gray-200 mb-2">Name</label>
            <input
              type="text"
              formControlName="name"
              placeholder="Insert name"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-200 mb-2">Surname</label>
            <input
              type="text"
              formControlName="surname"
              placeholder="Insert surname"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
            />
          </div>

        </div>

        <!-- EMAIL -->
        <div>
          <label class="block text-sm font-semibold text-gray-200 mb-2">Email</label>
          <input
            type="email"
            formControlName="email"
            placeholder="Insert email"
            class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
          />
        </div>

        <!-- PASSWORD -->
        <div>
          <label class="block text-sm font-semibold text-gray-200 mb-2">Password</label>
          <input
            type="password"
            formControlName="password"
            placeholder="Insert password"
            class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
          />
        </div>

        <!-- ADMIN -->
        <div>
          <label class="block text-sm font-semibold text-gray-200 mb-2">Administrator</label>
          <div class="flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 px-4 py-3">
            <span class="text-gray-300 text-sm">
              Grant full access permissions
            </span>

            <input
              type="checkbox"
              formControlName="admin"
              class="h-5 w-5 rounded border-white/20 bg-transparent text-blue-500 focus:ring-2 focus:ring-blue-500/30"
            />
          </div>
        </div>

        <!-- BUTTONS -->
        <div class="flex justify-between items-center pt-4">

          <!-- SINISTRA -->
          <button
            type="button"
            (click)="onCancel()"
            class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-2xl shadow-lg shadow-blue-900/30 transition-all"
          >
            Annulla
          </button>

          <!-- DESTRA -->
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-2xl shadow-lg shadow-blue-900/30 transition-all"
          >
            Create User
          </button>

        </div>

      </form>

    </div>
  </div>
</div>
