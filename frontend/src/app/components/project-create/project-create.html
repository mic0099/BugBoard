<div class="min-h-screen bg-gradient-to-br from-slate-700 to-gray-800 p-6 md:p-10">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.15),transparent_55%)] pointer-events-none"></div>

  <div class="relative z-10 max-w-4xl mx-auto">

    <!-- HEADER -->
    <div class="mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
        New Project
      </h1>
      <p class="text-gray-300 mt-2 text-base">
        Create a project and add members by email
      </p>
    </div>

    <!-- CARD -->
    <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl shadow-blue-950/20 p-6 md:p-8">

      <form [formGroup]="newProject" (ngSubmit)="onSubmit()" class="space-y-8">

        <!-- NOME PROGETTO -->
        <div>
          <label class="block text-sm font-semibold text-gray-200 mb-2">
            Project Name
          </label>

          <input
            data-testid="project-name-input"
            type="text"
            formControlName="name"
            placeholder="Insert Project Name"
            class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
          />
        </div>

        <!-- EMAIL -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <label class="text-sm font-semibold text-gray-200">
              Project Members
            </label>

            <button
              data-testid="project-add-email-button"
              type="button"
              (click)="addEmail()"
              class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-lg shadow-blue-900/30 transition-all"
            >
              + Add
            </button>
          </div>

          <div formArrayName="emails" class="space-y-3">

            <div
              *ngFor="let emailCtrl of emails.controls; let i = index"
              class="flex gap-3"
            >
              <input
                data-testid="project-email-input"
                [formControlName]="i"
                type="email"
                placeholder="email@example.com"
                class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-gray-400 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
              />

              <button
                type="button"
                (click)="removeEmail(i)"
                class="rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-300 px-4 py-2 text-sm font-semibold transition"
              >
                X
              </button>
            </div>

          </div>

          <!-- stato vuoto -->
          <div
            *ngIf="emails.length === 0"
            class="mt-4 text-sm text-gray-400"
          >
            No email added
          </div>
        </div>

        <!-- BUTTON -->
        <div class="flex justify-between items-center pt-4">

          <!-- SINISTRA -->
          <button
           data-testid="project-cancel-button"
            type="button"
            (click)="onCancel()"
            class="px-6 py-3 rounded-xl border border-white/10 bg-white/5 text-slate-300 font-semibold hover:bg-white/10 hover:text-white hover:border-white/20 transition-all active:scale-95"
          >
            Cancel
          </button>

          <!-- DESTRA -->
          <button
            data-testid="project-submit-button"
            type="submit"
            class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-2xl shadow-lg shadow-blue-900/30 transition-all"
          >
            Create Project
          </button>

        </div>

      </form>
    </div>
  </div>
</div>
