<div class="min-h-screen bg-gradient-to-br from-slate-700 to-gray-800 p-6 md:p-10">

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.15),transparent_60%)] pointer-events-none"></div>

  <div class="relative z-10">

    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-6">
      
      <div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">Issue Board</h1>
        <p class="text-gray-300 mt-1.5 text-base">Track and Manage project issues</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">

        <form data-testid="tag-search-form" (ngSubmit)="onTagSearch()" class="relative flex-grow sm:w-80">

          <input 
            data-testid="tag-search-input"
            type="text"
            name="tag"
            [(ngModel)]="searchTag"
            placeholder="Search by tag..."
            class="w-full pl-10 pr-4 py-2.5 
            bg-white/10 
            border border-white/20 
            rounded-xl 
            text-sm 
            text-white
            placeholder-gray-400
            focus:ring-2 focus:ring-blue-500/20 
            focus:border-blue-400
            transition-all outline-none">

          <button data-testid="tag-search-submit" type="submit" class="hidden"></button>

          <svg class="absolute left-3 top-3 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>

        </form>

        <button 
          (click)="addIssue()" 
          data-testid="new-issue-button"
          class="bg-blue-600 hover:bg-blue-500
          text-white text-sm font-semibold
          px-5 py-2.5 rounded-xl
          shadow-lg shadow-blue-900/30
          transition-all flex items-center gap-2">
          
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>

          New Issue
        </button>

      </div>
    </div>

    <div class="flex items-center justify-start gap-4 mb-10 w-full no-scrollbar"> 

      <div class="flex bg-white/10 p-1 rounded-xl border border-white/10">
        <button *ngFor="let s of ['all', 'todo', 'open', 'in_progress', 'closed']"
                (click)="setStatusFilter(s)"
                [ngClass]="activeStatus === s ? 'bg-white/20 text-white shadow-sm' : 'text-gray-300 hover:text-white hover:bg-white/10'"
                class="px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition-all">
          {{ s.replace('_', ' ') }}
        </button>
      </div>

      <div class="flex items-center gap-3 ml-auto">
      
        <!-- Bottone Priorità -->
        <div class="relative">
          <button 
            (click)="toggleMenu('priority', $event)"
            class="flex items-center gap-2 px-4 py-2 
            bg-white/10 border border-white/20 rounded-xl 
            text-sm font-medium text-gray-200
            hover:bg-white/20 hover:border-white/30 transition-all">
            
            <span>Priority</span>

            <span *ngIf="selectedPriorities.length > 0" 
                  class="bg-blue-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full">
              {{ selectedPriorities.length }}
            </span>

            <svg [ngClass]="{'rotate-180': openedMenu === 'priority'}" 
                class="w-4 h-4 text-gray-400 transition-transform duration-200" 
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M19 9l-7 7-7-7" stroke-width="2"/>
            </svg>

          </button>

          <div *ngIf="openedMenu === 'priority'"
              (click)="$event.stopPropagation()"
              class="absolute right-0 mt-2 w-52 z-50
              bg-gray-800 border border-gray-700
              rounded-xl shadow-2xl p-2 flex flex-col gap-1">

            <label *ngFor="let p of priorities"
                  class="flex items-center gap-3 px-3 py-2 hover:bg-gray-700 rounded-lg cursor-pointer group transition-colors">
              
              <input type="checkbox"
                    [checked]="selectedPriorities.includes(p)"
                    (change)="togglePriority(p, $event)"
                    class="w-4 h-4 rounded border-gray-500 text-blue-500 focus:ring-blue-500 bg-gray-700">

              <span class="text-sm capitalize text-gray-300 group-hover:text-white">
                {{ p }}
              </span>

            </label>
          </div>
        </div>

        <!-- Bottone Tipo -->
        <div class="relative">
          <button 
            (click)="toggleMenu('type', $event)"
            class="flex items-center gap-2 px-4 py-2 
            bg-white/10 border border-white/20 rounded-xl 
            text-sm font-medium text-gray-200
            hover:bg-white/20 hover:border-white/30 transition-all">
            
            <span>Type</span>

            <span *ngIf="selectedTypes.length > 0" 
                  class="bg-blue-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full">
              {{ selectedTypes.length }}
            </span>

            <svg [ngClass]="{'rotate-180': openedMenu === 'type'}" 
                class="w-4 h-4 text-gray-400 transition-transform duration-200" 
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M19 9l-7 7-7-7" stroke-width="2"/>
            </svg>

          </button>

          <div *ngIf="openedMenu === 'type'"
              (click)="$event.stopPropagation()"
              class="absolute right-0 mt-2 w-52 z-50
              bg-gray-800 border border-gray-700
              rounded-xl shadow-2xl p-2 flex flex-col gap-1">

            <label *ngFor="let t of types"
                  class="flex items-center gap-3 px-3 py-2 hover:bg-gray-700 rounded-lg cursor-pointer group transition-colors">
              
              <input type="checkbox"
                    [checked]="selectedTypes.includes(t)"
                    (change)="toggleType(t, $event)"
                    class="w-4 h-4 rounded border-gray-500 text-blue-500 focus:ring-blue-500 bg-gray-700">

              <span class="text-sm capitalize text-gray-300 group-hover:text-white">
                {{ t }}
              </span>

            </label>
          </div>
        </div>

        <div class="h-8 w-px bg-white/10 mx-1"></div>

        <button (click)="toggleSortDirection()" 
                class="flex items-center gap-2 px-4 py-2 
                text-sm font-semibold 
                text-blue-400 
                hover:bg-blue-500/10 
                rounded-xl 
                transition-all">

          <svg [ngClass]="{'rotate-180': sortDirection === 'desc'}" 
               class="w-4 h-4 transition-transform duration-300" 
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" stroke-width="2"/>
          </svg>

          {{ currentSortLabel }}
        </button>

      </div>
    </div> 

    <!--MESSAGGIO SOLO SE TAG SENZA RISULTATI -->
    <div *ngIf="currentTag && filteredIssues.length === 0" 
         class="text-center text-gray-400 mt-10">

      No issues found for the tag "{{ currentTag }}"

    </div>

    <!--GRID SOLO SE CI SONO RISULTATI -->
    <div *ngIf="filteredIssues.length > 0"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">

      <app-issue-item 
        *ngFor="let item of filteredIssues" 
        [issue]="item">
      </app-issue-item>

    </div>

  </div>
</div>
