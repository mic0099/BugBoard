<div class="fixed inset-0 z-[100] flex items-center justify-center p-4">

  <div
    class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm"
    (click)="closeModal()">
  </div>

  <div
    [formGroup]="editForm"
    class="relative w-full max-w-md bg-gray-800 border border-white/10 rounded-2xl shadow-2xl p-6 overflow-hidden">

    <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl"></div>

    <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
      <span class="text-blue-400">Edit</span>
      {{ project.name }}
    </h2>

    <div class="space-y-5 relative z-10">

      <div>
        <label class="block text-gray-400 text-xs font-semibold uppercase mb-1.5">
          New Name
        </label>

        <input
          formControlName="name"
          type="text"
          class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:border-blue-500/50 focus:ring-0 outline-none transition-all"
          placeholder="Add new Project Name...">
      </div>

      <div *ngIf="project.Users?.length" class="mb-4">

        <label class="block text-gray-400 text-xs font-semibold uppercase mb-2">
          Actual Members
        </label>

        <div class="flex flex-wrap gap-2">

          <div
            *ngFor="let user of project.Users"
            class="flex items-center gap-2 bg-white/10 border border-white/5 px-3 py-1.5 rounded-full group">

            <span class="text-xs text-gray-200">
              {{ user.email }}
            </span>

            <button
              type="button"
              (click)="$event.stopPropagation(); toggleRemoveMember(user.email)"
              class="text-gray-500 hover:text-red-400 transition-colors"
              [class.text-red-500]="isMarkedForRemoval(user.email)">

              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24">

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12">
                </path>

              </svg>

            </button>

          </div>

        </div>

      </div>

      <div>

        <label class="block text-gray-400 text-xs font-semibold uppercase mb-1.5">
          Add Members
        </label>

        <div class="flex gap-2 mb-3">

          <input
            formControlName="newEmailInput"
            type="email"
            class="flex-grow bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:border-blue-500/50 outline-none transition-all"
            placeholder="email@example.com"
            (keyup.enter)="addEmailToList()">

          <button
            type="button"
            (click)="addEmailToList()"
            class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 px-4 rounded-xl border border-blue-600/30 transition-all">

            Add

          </button>

        </div>

        <div
          class="flex flex-wrap gap-2 mb-4"
          *ngIf="emailsToAdd.length">

          <div
            *ngFor="let email of emailsToAdd"
            class="flex items-center gap-2 bg-green-500/20 border border-green-500/30 px-3 py-1 rounded-full">

            <span class="text-xs text-green-300">
              {{ email }}
            </span>

            <button
              type="button"
              (click)="removeEmailFromAddList(email)"
              class="text-green-400 hover:text-white">

              <svg
                class="w-3 h-3"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24">

                <path
                  d="M6 18L18 6M6 6l12 12"
                  stroke-width="2">
                </path>

              </svg>

            </button>

          </div>

        </div>

      </div>

      <div class="flex justify-between items-center pt-4">

        <button
          (click)="closeModal()"
          class="px-6 py-3 rounded-xl border border-white/10 bg-white/5 text-slate-300 font-semibold hover:bg-white/10 hover:text-white hover:border-white/20 transition-all active:scale-95">

          Cancel

        </button>

        <button
          (click)="saveProject()"
          class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-blue-900/40 transition-all">

          Save Changes

        </button>

      </div>

    </div>

  </div>

</div>
